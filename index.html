<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickDraft AI — Smart Reply & Content Generator</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #223047;
      --accent: #00f0ff;
      --accent-hover: #00c8d6;
      --text: #e6edf7;
      --muted: #8b9bb4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 4px;
    }
    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
      margin-top: 14px;
    }
    input, select, textarea {
      width: 100%;
      background: #0d131d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #041017;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .output-box {
      margin-top: 20px;
      background: #0d131d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
      display: none;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      margin-top: 10px;
      padding: 9px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ QuickDraft AI</h1>
    <p class="sub">Generate professional emails, LinkedIn DMs, and product descriptions in seconds.</p>

    <label for="apiKey">Groq API Key (Saved locally on your device)</label>
    <input type="password" id="apiKey" placeholder="Paste your gsk_... key here" />

    <label for="taskType">Select Task</label>
    <select id="taskType">
      <option value="Professional Email Reply">Professional Email Reply</option>
      <option value="Short LinkedIn Outreach DM">Short LinkedIn Outreach DM</option>
      <option value="High-Converting Product Description">High-Converting Product Description</option>
      <option value="Social Media Post">Engaging Social Media Post</option>
    </select>

    <label for="userInput">Details / Context</label>
    <textarea id="userInput" placeholder="Example: Reply politely to a client asking for a discount on email/calendar management..."></textarea>

    <button id="generateBtn" onclick="generateText()">Generate with AI</button>

    <div class="output-box" id="outputBox"></div>
    <button class="copy-btn" id="copyBtn" style="display:none;" onclick="copyResult()">Copy Result</button>
  </div>

  <script>
    const keyInput = document.getElementById('apiKey');
    keyInput.value = localStorage.getItem('groq_api_key') || '';
    keyInput.addEventListener('input', () => {
      localStorage.setItem('groq_api_key', keyInput.value.trim());
    });

    async function generateText() {
      const apiKey = keyInput.value.trim();
      const task = document.getElementById('taskType').value;
      const context = document.getElementById('userInput').value.trim();
      const btn = document.getElementById('generateBtn');
      const outputBox = document.getElementById('outputBox');
      const copyBtn = document.getElementById('copyBtn');

      if (!apiKey) return alert('Please paste your Groq API key first.');
      if (!context) return alert('Please enter some details.');

      btn.disabled = true;
      btn.textContent = 'Generating...';
      outputBox.style.display = 'none';
      copyBtn.style.display = 'none';

      const prompt = `Write a clear, concise, and ready-to-use ${task} based on these details:\n\n${context}`;

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              { role: 'system', content: 'You are a sharp, practical assistant that writes clean, ready-to-use copy.' },
              { role: 'user', content: prompt }
            ],
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const result = data.choices[0].message.content;
        outputBox.textContent = result;
        outputBox.style.display = 'block';
        copyBtn.style.display = 'block';
      } catch (err) {
        outputBox.textContent = 'Error: ' + err.message;
        outputBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate with AI';
      }
    }

    function copyResult() {
      navigator.clipboard.writeText(document.getElementById('outputBox').textContent);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = 'Copied!';
      setTimeout(() => (copyBtn.textContent = 'Copy Result'), 1500);
    }
  </script>
</body>
</html>
