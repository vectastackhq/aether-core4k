<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aether Core 4K | Satisfying Neon Ascent</title>
    <style>
        :root {
            --bg-color: #050508;
            --card-bg: rgba(15, 15, 30, 0.95);
            --text-color: #ffffff;
            --accent-color: #00f2fe;
            --border-color: rgba(0, 242, 254, 0.3);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-user-select: none; touch-action: none;
        }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* HUD Header */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 5;
        }
        .stat-box {
            background: var(--card-bg); padding: 8px 14px; border-radius: 12px;
            border: 1px solid var(--border-color); backdrop-filter: blur(10px);
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
            pointer-events: auto;
        }
        .stat-label { font-size: 10px; letter-spacing: 1.5px; color: #8899a6; text-transform: uppercase; }
        .stat-val { font-size: 20px; font-weight: 800; color: var(--accent-color); }
        .hearts-val { font-size: 18px; letter-spacing: 2px; }

        .hud-buttons { display: flex; gap: 8px; pointer-events: auto; }
        .icon-btn {
            background: var(--card-bg); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 8px 12px; border-radius: 8px;
            font-size: 12px; font-weight: bold; cursor: pointer; backdrop-filter: blur(8px);
        }

        /* Non-Interrupting Drawer */
        #amazon-drawer {
            position: absolute; right: -280px; top: 80px; width: 260px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 15px 0 0 15px; padding: 15px; z-index: 10;
            transition: right 0.3s ease; backdrop-filter: blur(10px);
        }
        #amazon-drawer.open { right: 0; }
        .drawer-toggle {
            position: absolute; left: -42px; top: 15px; background: #ff9900;
            color: #000; padding: 10px; border-radius: 10px 0 0 10px;
            font-weight: bold; cursor: pointer; border: none;
        }

        /* Modals */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 12, 0.88); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .hidden { display: none !important; }

        .neon-card {
            background: var(--card-bg); border: 2px solid var(--accent-color);
            border-radius: 20px; padding: 25px; width: 90%; max-width: 480px;
            text-align: center; box-shadow: 0 0 30px var(--border-color); position: relative;
        }
        .neon-title {
            font-size: 28px; font-weight: 900;
            background: linear-gradient(45deg, var(--accent-color), #ff007f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .skins-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin: 15px 0; max-height: 220px; overflow-y: auto;
        }
        .skin-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 8px; text-align: center; cursor: pointer;
        }
        .skin-card.active { border-color: var(--accent-color); background: rgba(0, 242, 254, 0.1); }

        #previewCanvas {
            width: 90px; height: 90px; margin: 0 auto 10px;
            border-radius: 50%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color);
        }

        .menu-btn {
            width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 10px;
            font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        .btn-enter { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #000; }
        .btn-skins { background: transparent; border: 2px solid #ff007f; color: #ff007f; }
        .btn-leave { background: rgba(255, 42, 109, 0.15); border: 1px solid #ff2a6d; color: #ff2a6d; }
        .btn-back { position: absolute; top: 15px; left: 15px; background: transparent; border: 1px solid #8899a6; color: #8899a6; padding: 6px 12px; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="hud">
        <div class="stat-box">
            <div>
                <div class="stat-label">Score</div>
                <div id="score" class="stat-val">0</div>
            </div>
            <div style="border-left: 1px solid var(--border-color); padding-left: 10px;">
                <div class="stat-label">Lives</div>
                <div id="heartsContainer" class="hearts-val">❤️❤️❤️</div>
            </div>
        </div>

        <div class="hud-buttons">
            <button id="lobbyBtn" class="icon-btn" style="border-color:#00f2fe; color:#00f2fe;" onclick="openMain()">🏠 Lobby</button>
            <button id="saveBtn" class="icon-btn hide-on-play" onclick="openLogin()">👤 Save</button>
        </div>
    </div>

    <!-- Non-Interruptive Amazon Store Drawer -->
    <div id="amazon-drawer" class="hide-on-play">
        <button class="drawer-toggle" onclick="toggleAmazon()">🛒 STORE</button>
        <h4 style="color:#ff9900; margin-bottom: 8px;">Amazon Gaming Gear</h4>
        <a href="https://www.amazon.com" target="_blank" onclick="unlockAmazonSkin()" style="display:block; background:#ff9900; color:#000; padding:8px; text-align:center; border-radius:8px; font-weight:bold; text-decoration:none; font-size:12px;">Browse Deals</a>
    </div>

    <!-- Main Menu Pop-up -->
    <div id="main-menu" class="modal-overlay">
        <div class="neon-card">
            <div class="neon-title">AETHER CORE 4K</div>
            <p style="font-size:12px; color:#8899a6; margin-bottom:15px;">Satisfying Vertical Core Runner</p>

            <button class="menu-btn btn-enter" onclick="startGame()">⚡ Enter Game</button>
            <button class="menu-btn btn-skins" onclick="openSkins()">✨ Skins & Powers</button>
            <button class="menu-btn btn-leave" onclick="leaveGame()">❌ Leave Website</button>
        </div>
    </div>

    <!-- Skins Pop-up -->
    <div id="skins-menu" class="modal-overlay hidden">
        <button class="btn-back" onclick="openMain()">← Go Back</button>
        <div class="neon-card">
            <h3 style="font-size: 18px; color:var(--accent-color); margin-bottom:5px;">SKIN PREVIEW</h3>
            <canvas id="previewCanvas" width="90" height="90"></canvas>

            <div class="skins-grid" id="skinsContainer"></div>
            <button class="menu-btn btn-skins" onclick="unequipSkin()" style="font-size:11px; padding:8px;">Reset Default Skin</button>
        </div>
    </div>

    <!-- Account Save Modal -->
    <div id="login-menu" class="modal-overlay hidden">
        <button class="btn-back" onclick="closeLogin()">← Go Back</button>
        <div class="neon-card">
            <div class="neon-title" style="font-size:22px;">SAVE USER PROGRESS</div>
            <input type="text" id="username" placeholder="Enter Username" style="width:100%; padding:10px; margin:15px 0; border-radius:8px; border:1px solid var(--border-color); background:rgba(0,0,0,0.3); color:#fff;">
            <button class="menu-btn btn-enter" onclick="saveUserLogin()">Save Progress</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const heartsContainer = document.getElementById('heartsContainer');

        let width, height, dpr;
        let score = 0;
        let hearts = 3;
        let gameRunning = false;

        // Balanced Smooth Scroll Physics
        let baseScrollSpeed = 1.4;
        let currentScrollSpeed = 1.4;

        // Player Core Settings (Normalized Size)
        const player = {
            x: 0, y: 0, targetX: 0, targetY: 0, radius: 15,
            skin: 'default', color: '#00f2fe', trail: [],
            shieldActive: false, shieldEndTime: 0, shieldDuration: 30000
        };

        const skins = [
            { id: 'default', name: '💎 Aether Core', color: '#00f2fe', unlocked: true },
            { id: 'beast', name: '🐉 Abyssal Beast', color: '#ff0055', unlocked: true },
            { id: 'spidey', name: '🕷️ Spider-Glow', color: '#ff0033', unlocked: true },
            { id: 'cap', name: '🛡️ Captain Shield', color: '#0055ff', unlocked: true }
        ];

        let targets = [], obstacles = [], shields = [];

        function resize() {
            dpr = window.devicePixelRatio || 1;
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width * dpr; canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            if (player.x === 0) { player.x = player.targetX = width / 2; player.y = player.targetY = height * 0.75; }
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('pointermove', (e) => { if(gameRunning){ player.targetX = e.clientX; player.targetY = e.clientY; } });

        function setGameplayUI(isPlaying) {
            const elementsToHide = document.querySelectorAll('.hide-on-play');
            elementsToHide.forEach(el => {
                if (isPlaying) el.classList.add('hidden');
                else el.classList.remove('hidden');
            });
        }

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('skins-menu').classList.add('hidden');
            setGameplayUI(true);
            hearts = 3;
            score = 0;
            scoreEl.textContent = '0';
            updateHeartsUI();
            gameRunning = true;
        }

        function openMain() {
            gameRunning = false;
            setGameplayUI(false);
            document.getElementById('skins-menu').classList.add('hidden');
            document.getElementById('login-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function openSkins() { renderSkinsList(); document.getElementById('main-menu').classList.add('hidden'); document.getElementById('skins-menu').classList.remove('hidden'); }
        function leaveGame() { window.location.href = "https://www.google.com"; }
        function toggleAmazon() { document.getElementById('amazon-drawer').classList.toggle('open'); }
        function openLogin() { document.getElementById('login-menu').classList.remove('hidden'); }
        function closeLogin() { document.getElementById('login-menu').classList.add('hidden'); }

        function updateHeartsUI() {
            let str = '';
            for(let i=0; i<hearts; i++) str += '❤️';
            heartsContainer.textContent = str || '💀';
        }

        function triggerDamage() {
            if (player.shieldActive) return; // Invincible when shield is active
            hearts--;
            updateHeartsUI();
            if (hearts <= 0) {
                alert("Game Over! Returning to Lobby.");
                openMain();
            }
        }

        // Spawners
        function spawnTarget() {
            targets.push({ x: Math.random()*(width-60)+30, y: -30, radius: 10, color: `hsl(${Math.random()*60+160}, 100%, 60%)` });
        }
        function spawnObstacle() {
            const obsW = Math.random() * 60 + 50;
            obstacles.push({ x: Math.random() * (width - obsW - 40) + 20, y: -30, w: obsW, h: 12 });
        }
        function spawnShieldItem() {
            shields.push({ x: Math.random() * (width - 60) + 30, y: -30, radius: 12 });
        }

        // Random Shield Spawner (Every 25-45 seconds)
        setInterval(() => {
            if (gameRunning) spawnShieldItem();
        }, Math.random() * 20000 + 25000);

        for(let i=0; i<5; i++) {
            targets.push({ x: Math.random()*(width-60)+30, y: Math.random()*height, radius: 10, color: `hsl(${Math.random()*60+160}, 100%, 60%)` });
        }

        // Preview rendering
        function renderSkinsList() {
            const container = document.getElementById('skinsContainer');
            container.innerHTML = '';
            skins.forEach(s => {
                const card = document.createElement('div');
                card.className = `skin-card ${player.skin === s.id ? 'active' : ''}`;
                card.innerHTML = `<div style="font-size:12px; font-weight:bold;">${s.name}</div>`;
                card.onclick = () => { player.skin = s.id; player.color = s.color; renderSkinsList(); };
                container.appendChild(card);
            });
        }
        function unequipSkin() { player.skin = 'default'; player.color = '#00f2fe'; renderSkinsList(); }

        // Main Loop
        function loop() {
            ctx.save();
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            const now = Date.now();

            if (gameRunning) {
                // Smooth slow speed progression (satisfying feel)
                currentScrollSpeed = baseScrollSpeed + Math.min(score / 15000, 1.8);

                player.x += (player.targetX - player.x) * 0.12;
                player.y += (player.targetY - player.y) * 0.12;

                player.trail.push({ x: player.x, y: player.y });
                if (player.trail.length > 8) player.trail.shift();

                ctx.beginPath();
                player.trail.forEach(pt => ctx.lineTo(pt.x, pt.y));
                ctx.strokeStyle = player.color; ctx.lineWidth = player.radius * 0.5; ctx.stroke();

                // Draw Player
                ctx.shadowBlur = 15; ctx.shadowColor = player.color; ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();

                // Shield Timer Arc / Ring Mechanics
                if (player.shieldActive) {
                    const remainingTime = Math.max(0, player.shieldEndTime - now);
                    if (remainingTime <= 0) {
                        player.shieldActive = false;
                    } else {
                        const progress = remainingTime / player.shieldDuration;
                        ctx.beginPath();
                        ctx.arc(player.x, player.y, player.radius + 10, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * progress));
                        ctx.strokeStyle = '#00f2fe';
                        ctx.lineWidth = 4;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#00f2fe';
                        ctx.stroke();
                    }
                }

                if (Math.random() < 0.02) spawnTarget();
                if (Math.random() < 0.006) spawnObstacle();
            }

            // Move Targets
            targets.forEach((t, i) => {
                if (gameRunning) t.y += currentScrollSpeed;
                ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2); ctx.fill();

                if (gameRunning && Math.hypot(player.x - t.x, player.y - t.y) < player.radius + t.radius) {
                    score += 100; scoreEl.textContent = score;
                    targets.splice(i, 1);
                } else if (t.y > height + 50) targets.splice(i, 1);
            });

            // Move Obstacles
            obstacles.forEach((ob, i) => {
                if (gameRunning) ob.y += currentScrollSpeed;
                ctx.fillStyle = '#ff2a6d'; ctx.shadowBlur = 8; ctx.shadowColor = '#ff2a6d';
                ctx.fillRect(ob.x, ob.y, ob.w, ob.h); ctx.shadowBlur = 0;

                if (gameRunning && player.x + player.radius > ob.x && player.x - player.radius < ob.x + ob.w &&
                    player.y + player.radius > ob.y && player.y - player.radius < ob.y + ob.h) {
                    triggerDamage();
                    obstacles.splice(i, 1);
                } else if (ob.y > height + 50) obstacles.splice(i, 1);
            });

            // Move Shield Items
            shields.forEach((sh, i) => {
                if (gameRunning) sh.y += currentScrollSpeed;
                ctx.fillStyle = '#00f2fe'; ctx.shadowBlur = 12; ctx.shadowColor = '#00f2fe';
                ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.radius, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

                if (gameRunning && Math.hypot(player.x - sh.x, player.y - sh.y) < player.radius + sh.radius) {
                    player.shieldActive = true;
                    player.shieldEndTime = Date.now() + player.shieldDuration;
                    shields.splice(i, 1);
                } else if (sh.y > height + 50) shields.splice(i, 1);
            });

            ctx.restore();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
