<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open-World Gang Wars & Armory - Web Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05080c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #ff3d00;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(255,61,0,0.4);
        }
        h2 { margin: 0 0 8px 0; font-size: 16px; color: #ff3d00; letter-spacing: 1px; }
        p { margin: 3px 0; font-size: 13px; color: #ddd; }
        #interaction-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffeb3b;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #ffeb3b;
            font-weight: bold;
            display: none;
            pointer-events: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="hud">
        <h2>GANG WARS & ARMORY SIMULATOR</h2>
        <p id="mode-text">MODE: Walking on Foot</p>
        <p id="weapon-text">WEAPON: Unarmed</p>
        <p id="ammo-text">AMMO: --</p>
        <p id="health-text">HEALTH: 100%</p>
        <p><b>CONTROLS:</b> [W/A/S/D] Move/Drive | [F] Enter/Exit Car | [E] Interact | [SPACE] Shoot</p>
    </div>

    <div id="interaction-prompt">PRESS [E] TO INTERACT / BUY WEAPONS / REFUEL</div>

    <!-- Import Three.js via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24); // Gritty urban dusk sky
        scene.fog = new THREE.FogExp2(0x1a1a24, 0.006);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sun = new THREE.DirectionalLight(0xff5722, 1.0); // Orange sunset glow
        sun.position.set(40, 80, 40);
        sun.castShadow = true;
        scene.add(sun);

        // --- 2. MATERIALS ---
        const roadMat = new THREE.MeshToonMaterial({ color: 0x1f1f1f });
        const sidewalkMat = new THREE.MeshToonMaterial({ color: 0x666666 });
        const carMat = new THREE.MeshToonMaterial({ color: 0x144522 }); 
        const playerMat = new THREE.MeshToonMaterial({ color: 0x0288d1 }); 
        const armoryMat = new THREE.MeshToonMaterial({ color: 0x37474f }); // Dark steel armory building
        const gasMat = new THREE.MeshToonMaterial({ color: 0xd32f2f }); 
        const gangMat = new THREE.MeshToonMaterial({ color: 0xb71c1c }); // Rival gang members (Crimson red)

        // --- 3. BUILD WORLD MAP & FACILITIES ---
        const road = new THREE.Mesh(new THREE.PlaneGeometry(20, 2500), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        const sidewalkL = new THREE.Mesh(new THREE.PlaneGeometry(4, 2500), sidewalkMat);
        sidewalkL.rotation.x = -Math.PI / 2;
        sidewalkL.position.set(-12, 0.02, 0);
        scene.add(sidewalkL);

        const sidewalkR = new THREE.Mesh(new THREE.PlaneGeometry(4, 2500), sidewalkMat);
        sidewalkR.rotation.x = -Math.PI / 2;
        sidewalkR.position.set(12, 0.02, 0);
        scene.add(sidewalkR);

        // Interactable Buildings & Zones
        const interactableZones = [];

        function createBuilding(x, z, width, height, depth, material, label) {
            const bldg = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
            bldg.position.set(x, height / 2, z);
            bldg.castShadow = true;
            scene.add(bldg);
            interactableZones.push({ x, z, radius: 9, name: label });
        }

        // City Layout
        createBuilding(-20, -40, 12, 14, 20, armoryMat, 'Weapons Armory (Press E to Buy Rifle/Ammo)');
        createBuilding(20, -90, 10, 10, 18, gasMat, 'Fuel Station & Service Hub');
        createBuilding(-22, -160, 14, 12, 22, new THREE.MeshToonMaterial({ color: 0x4e342e }), 'Safehouse & Gang Headquarters');

        // --- 4. PLAYER, VEHICLE & RIVAL GANG MEMBERS ---
        const player = new THREE.Group();
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.4), playerMat);
        bodyMesh.position.y = 0.8;
        bodyMesh.castShadow = true;
        player.add(bodyMesh);
        player.position.set(0, 0, 5);
        scene.add(player);

        // Vehicle
        const car = new THREE.Group();
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 3.8), carMat);
        carBody.position.y = 0.45;
        carBody.castShadow = true;
        car.add(carBody);
        car.position.set(0, 0, 0);
        scene.add(car);

        // Spawn Rival Gang Members in the Open World
        const enemies = [];
        for (let i = 0; i < 5; i++) {
            const enemy = new THREE.Group();
            const eBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.4), gangMat);
            eBody.position.y = 0.8;
            enemy.add(eBody);
            enemy.position.set((Math.random() - 0.5) * 10, 0, -100 - (i * 50));
            scene.add(enemy);
            enemies.push({ mesh: enemy, health: 100, active: true });
        }

        // --- 5. GAME STATE & CONTROLS ---
        let isDriving = false;
        let currentWeapon = 'Unarmed';
        let ammo = 0;
        let health = 100;
        let currentLocationText = 'City Streets';
        const input = { w: false, a: false, s: false, d: false };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') input.w = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') input.s = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.a = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') input.d = true;

            // Toggle Vehicle Mode
            if (e.code === 'KeyF') {
                isDriving = !isDriving;
                if (isDriving) {
                    player.visible = false;
                    car.position.set(player.position.x, 0, player.position.z);
                    document.getElementById('mode-text').innerText = 'MODE: Driving Car';
                } else {
                    player.visible = true;
                    player.position.set(car.position.x + 2, 0, car.position.z);
                    document.getElementById('mode-text').innerText = 'MODE: Walking on Foot';
                }
            }

            // Interact [E] with Armory or Zones
            if (e.code === 'KeyE') {
                interactableZones.forEach(zone => {
                    const dist = Math.hypot((isDriving ? car.position.x : player.position.x) - zone.x, (isDriving ? car.position.z : player.position.z) - zone.z);
                    if (dist < 10) {
                        if (zone.name.includes('Armory')) {
                            currentWeapon = 'Assault Rifle';
                            ammo = 120;
                            alert('Armory Access Granted: You equipped an Assault Rifle with 120 Rounds!');
                        } else if (zone.name.includes('Fuel')) {
                            alert('Vehicle refueled completely!');
                        } else {
                            alert(`Entered: ${zone.name}`);
                        }
                    }
                });
            }

            // Shoot Weapon [SPACEBAR]
            if (e.code === 'Space' && !isDriving && currentWeapon !== 'Unarmed' && ammo > 0) {
                ammo--;
                // Check if any rival gang member is in line of sight/close range
                enemies.forEach(en => {
                    if (en.active) {
                        const dist = player.position.distanceTo(en.mesh.position);
                        if (dist < 25) {
                            en.health -= 50;
                            if (en.health <= 0) {
                                en.mesh.visible = false;
                                en.active = false;
                                alert('Rival Gang Member Neutralized!');
                            }
                        }
                    }
                });
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') input.w = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') input.s = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.a = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') input.d = false;
        });

        // --- 6. GAME LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (isDriving) {
                if (input.w) car.position.z -= 0.45;
                if (input.s) car.position.z += 0.25;
                if (input.a && car.position.x > -8) car.position.x -= 0.15;
                if (input.d && car.position.x < 8) car.position.x += 0.15;

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, car.position.x * 0.5, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 3.5, 0.1);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, car.position.z + 8.0, 0.1);
                camera.lookAt(car.position.x, car.position.y, car.position.z - 3);
            } else {
                const walkSpeed = 0.18;
                if (input.w) player.position.z -= walkSpeed;
                if (input.s) player.position.z += walkSpeed;
                if (input.a) player.position.x -= walkSpeed;
                if (input.d) player.position.x += walkSpeed;

                camera.position.x = THREE.MathUtils.lerp(camera.position.x, player.position.x, 0.1);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, 2.5, 0.1);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, player.position.z + 5.0, 0.1);
                camera.lookAt(player.position.x, player.position.y, player.position.z - 2);
            }

            // Check Proximity to Zones
            let nearZone = false;
            interactableZones.forEach(zone => {
                const activePos = isDriving ? car.position : player.position;
                if (Math.hypot(activePos.x - zone.x, activePos.z - zone.z) < 10) {
                    nearZone = true;
                    currentLocationText = zone.name;
                }
            });

            document.getElementById('interaction-prompt').style.display = nearZone ? 'block' : 'none';
            document.getElementById('weapon-text').innerText = `WEAPON: ${currentWeapon}`;
            document.getElementById('ammo-text').innerText = `AMMO: ${ammo}`;
            document.getElementById('health-text').innerText = `HEALTH: ${health}%`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
