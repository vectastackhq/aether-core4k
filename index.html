<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER-NINJA: APEX RUNNER</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #030712;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 800px;
            max-width: 100vw;
            height: 420px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            overflow: hidden;
            background: #050b14;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00f3ff;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .modal.hidden {
            display: none;
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00f3ff;
        }

        h1 span {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        p {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .btn {
            background: #00f3ff;
            color: #030712;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        .btn:hover {
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="420"></canvas>
        
        <div class="ui-layer">
            <div class="hud-header">
                <div>SCORE: <span id="scoreBox">000000</span></div>
                <div>HI: <span id="hiScoreBox">000000</span></div>
            </div>

            <!-- START MENU -->
            <div id="startModal" class="modal">
                <h1>CYBER<span>NINJA</span></h1>
                <p>Tap Screen or Press Space to Jump</p>
                <button class="btn" onclick="startGame()">START GAME</button>
            </div>

            <!-- GAME OVER MENU -->
            <div id="gameOverModal" class="modal hidden">
                <h1 style="color: #ff0055;">SYSTEM CRASH</h1>
                <p id="finalScoreText">Score: 0</p>
                <button class="btn" onclick="startGame()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "MENU"; 
        let score = 0;
        let highScore = localStorage.getItem("cyber_hi") || 0;
        let gameSpeed = 5;
        let ticks = 0;

        let player = {
            x: 80,
            y: 270,
            width: 36,
            height: 48,
            vy: 0,
            gravity: 0.65,
            jumpForce: -12,
            grounded: false,
            jumpsLeft: 2
        };

        let obstacles = [];
        let particles = [];

        function triggerJump() {
            if (gameState === "PLAYING") {
                if (player.grounded || player.jumpsLeft > 0) {
                    player.vy = player.jumpForce;
                    player.grounded = false;
                    player.jumpsLeft--;
                    createParticles(player.x + 18, player.y + player.height, "#00f3ff", 6);
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                triggerJump();
            }
        });

        canvas.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            triggerJump();
        });

        function startGame() {
            document.getElementById("startModal").classList.add("hidden");
            document.getElementById("gameOverModal").classList.add("hidden");
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            particles = [];
            player.y = 270;
            player.vy = 0;
            ticks = 0;
            gameState = "PLAYING";
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    color: color
                });
            }
        }

        function update() {
            if (gameState !== "PLAYING") return;

            ticks++;
            score += Math.floor(gameSpeed * 0.2);
            gameSpeed += 0.001;

            player.vy += player.gravity;
            player.y += player.vy;

            const floor = 330;
            if (player.y + player.height > floor) {
                player.y = floor - player.height;
                player.vy = 0;
                player.grounded = true;
                player.jumpsLeft = 2;
            }

            if (ticks % 90 === 0) {
                obstacles.push({
                    x: canvas.width + 50,
                    y: 285,
                    width: 30,
                    height: 45
                });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                if (
                    player.x < obstacles[i].x + obstacles[i].width - 6 &&
                    player.x + player.width - 6 > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height - 4 &&
                    player.y + player.height - 4 > obstacles[i].y
                ) {
                    gameState = "GAMEOVER";
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("cyber_hi", highScore);
                    }
                    document.getElementById("finalScoreText").innerText = "Score: " + score;
                    document.getElementById("gameOverModal").classList.remove("hidden");
                }

                if (obstacles[i].x < -50) obstacles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            document.getElementById("scoreBox").innerText = String(score).padStart(6, '0');
            document.getElementById("hiScoreBox").innerText = String(highScore).padStart(6, '0');
        }

        function render() {
            ctx.fillStyle = "#050b14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#00f3ff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.lineTo(canvas.width, 330);
            ctx.stroke();

            // Draw Player Character
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#00f3ff";

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(4, 10, 28, 28);
            ctx.fillStyle = "#00f3ff";
            ctx.fillRect(8, 14, 20, 3);
            ctx.fillRect(13, 20, 10, 10);

            ctx.fillStyle = "#1e293b";
            ctx.fillRect(6, 0, 24, 12);
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(12, 3, 10, 3);

            ctx.fillStyle = "#0f172a";
            ctx.fillRect(8, 38, 6, 10);
            ctx.fillRect(22, 38, 6, 10);
            ctx.restore();

            // Draw Obstacles
            obstacles.forEach(obs => {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff0055";
                ctx.fillStyle = "#ff0055";
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y + obs.height);
                ctx.lineTo(obs.x + obs.width / 2, obs.y);
                ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
            ctx.globalAlpha = 1.0;
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
