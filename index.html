<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horror Sanctuary - 3D Web Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 5;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #ef4444;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 5px rgba(255,0,0,0.8);
        }
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.8rem;
            color: #ef4444;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
            letter-spacing: 4px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            letter-spacing: 6px;
            margin-bottom: 25px;
        }
        p {
            color: #64748b;
            max-width: 420px;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
            color: #fff;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            transition: transform 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
    <!-- Load Three.js 3D WebGL Library via CDN for GitHub compatibility -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="webgl-container"></div>
<div id="crosshair"></div>

<div id="uiOverlay" style="display: none;">
    <div class="hud-row">
        <div id="objectiveDisplay">OBJECTIVE: FIND THE ESCAPE KEY</div>
        <div id="sanitDisplay">SANITY: 100%</div>
    </div>
    <div class="hud-row">
        <div id="itemDisplay">INVENTORY: EMPTY</div>
        <div id="statusDisplay">STATUS: EXPLORING</div>
    </div>
</div>

<div id="menuScreen">
    <h1>SANCTUARY</h1>
    <div class="subtitle">3D HORROR EXPERIENCE</div>
    <p>Trapped inside a dark, cursed corridor facility. Locate the missing structural key before the shadow entity captures you. Drag to look around, use screen controls to move.</p>
    <button class="btn" onclick="startGame()">ENTER DARKNESS</button>
</div>

<script>
    let scene, camera, renderer;
    let gameRunning = false;
    let sanity = 100;
    let hasKey = false;
    let keyMesh, monsterMesh;
    
    // Player movement vectors
    const player = {
        x: 0,
        z: 0,
        rotY: 0,
        speed: 0.08
    };

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let touchStartX = 0, touchStartY = 0;

    function initEngine() {
        const container = document.getElementById('webgl-container');
        
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.08);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Ambient dark horror lighting
        const ambientLight = new THREE.AmbientLight(0x111122, 0.4);
        scene.add(ambientLight);

        // Player flashlight
        const flashlight = new THREE.SpotLight(0xfff5e6, 2.5, 20, Math.PI / 5, 0.5, 1);
        flashlight.position.set(0, 1.6, 0);
        camera.add(flashlight);
        flashlight.target.position.set(0, 1.6, -5);
        camera.add(flashlight.target);
        scene.add(camera);

        buildEnvironment();
        setupControls();

        window.addEventListener('resize', onWindowResize);
    }

    function buildEnvironment() {
        // Floor
        const floorGeo = new THREE.PlaneGeometry(30, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Ceiling
        const ceilingGeo = new THREE.PlaneGeometry(30, 60);
        const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x050508, roughness: 1.0 });
        const ceiling = new THREE.Mesh(ceilingGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 4;
        scene.add(ceiling);

        // Walls (Long Corridor)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
        
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 60), wallMat);
        leftWall.position.set(-5, 2, 0);
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1, 4, 60), wallMat);
        rightWall.position.set(5, 2, 0);
        scene.add(rightWall);

        // Add spooky pillars / structural beams
        for (let z = -25; z <= 25; z += 8) {
            const pillarGeo = new THREE.BoxGeometry(0.8, 4, 0.8);
            const p1 = new THREE.Mesh(pillarGeo, wallMat);
            p1.position.set(-4.5, 2, z);
            scene.add(p1);

            const p2 = new THREE.Mesh(pillarGeo, wallMat);
            p2.position.set(4.5, 2, z);
            scene.add(p2);
        }

        // Spawn Key item deep in the hall
        const keyGeo = new THREE.BoxGeometry(0.4, 0.8, 0.1);
        const keyMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, roughness: 0.3 });
        keyMesh = new THREE.Mesh(keyGeo, keyMat);
        keyMesh.position.set((Math.random() - 0.5) * 6, 1, -22);
        scene.add(keyMesh);

        // Spawn lurking horror entity shadow
        const monsterGeo = new THREE.ConeGeometry(1, 3.5, 6);
        const monsterMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        monsterMesh = new THREE.Mesh(monsterGeo, monsterMat);
        monsterMesh.position.set(0, 1.75, -28);
        scene.add(monsterMesh);
    }

    function setupControls() {
        // Touch / Mouse Look & Move simulation for mobile & browser
        window.addEventListener('pointerdown', (e) => {
            touchStartX = e.clientX;
            touchStartY = e.clientY;
            // Simple tap to move forward toggle or steering
            moveForward = true;
        });

        window.addEventListener('pointermove', (e) => {
            if (!gameRunning) return;
            const deltaX = e.clientX - touchStartX;
            player.rotY -= deltaX * 0.003;
            camera.rotation.y = player.rotY;
            touchStartX = e.clientX;
        });

        window.addEventListener('pointerup', () => {
            moveForward = false;
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function startGame() {
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('uiOverlay').style.display = 'flex';
        gameRunning = true;
        animate();
    }

    function animate() {
        if (!gameRunning) return;
        requestAnimationFrame(animate);

        // Move player forward automatically when holding touch/click or exploring
        if (moveForward) {
            player.x -= Math.sin(player.rotY) * player.speed;
            player.z -= Math.cos(player.rotY) * player.speed;
            camera.position.x = player.x;
            camera.position.z = player.z;
        }

        // Boundary clamp inside corridor
        player.x = Math.max(-4, Math.min(4, player.x));
        player.z = Math.max(-28, Math.min(25, player.z));
        camera.position.x = player.x;
        camera.position.z = player.z;

        // Animate monster slowly stalking player
        if (monsterMesh) {
            monsterMesh.position.z += 0.025; // Stalking speed
            if (monsterMesh.position.z > camera.position.z) {
                gameOver("THE ENTITY CAUGHT YOU");
                return;
            }
        }

        // Key pickup detection
        if (!hasKey && keyMesh) {
            let dist = Math.hypot(camera.position.x - keyMesh.position.x, camera.position.z - keyMesh.position.z);
            if (dist < 1.5) {
                hasKey = true;
                scene.remove(keyMesh);
                document.getElementById('itemDisplay').innerText = 'INVENTORY: SANCTUARY KEY';
                document.getElementById('objectiveDisplay').innerText = 'OBJECTIVE: ESCAPE THROUGH THE START';
            }
        }

        // Check win condition (returned to start with key)
        if (hasKey && camera.position.z > 20) {
            gameWin();
            return;
        }

        renderer.render(scene, camera);
    }

    function gameOver(reason) {
        gameRunning = false;
        document.getElementById('uiOverlay').style.display = 'none';
        const menu = document.getElementById('menuScreen');
        menu.style.display = 'flex';
        menu.querySelector('h1').innerText = reason;
        menu.querySelector('.subtitle').innerText = 'DARKNESS CONSUMED YOU';
        menu.querySelector('.btn').innerText = 'TRY AGAIN';
    }

    function gameWin() {
        gameRunning = false;
        document.getElementById('uiOverlay').style.display = 'none';
        const menu = document.getElementById('menuScreen');
        menu.style.display = 'flex';
        menu.querySelector('h1').innerText = 'YOU ESCAPED';
        menu.querySelector('.subtitle').innerText = 'SANITY RETAINED';
        menu.querySelector('p').innerText = 'You successfully navigated the dark corridors and survived the entity.';
        menu.querySelector('.btn').innerText = 'PLAY AGAIN';
    }

    window.onload = initEngine;
</script>

</body>
</html>
