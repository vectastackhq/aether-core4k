<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aether Core 4K - Quantum Breach Nexus</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #02040a;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 5;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #00f3ff;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.8);
        }
        #reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border: 2px solid rgba(0, 243, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 0 10px rgba(0,243,255,0.8);
        }
        #menuScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 10, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.8rem;
            color: #00f3ff;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.9);
            letter-spacing: 3px;
        }
        .subtitle {
            color: #f43f5e;
            font-size: 0.85rem;
            letter-spacing: 6px;
            margin-bottom: 25px;
        }
        p {
            color: #94a3b8;
            max-width: 420px;
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #00f3ff 0%, #3b82f6 100%);
            color: #020410;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            transition: transform 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
    <!-- Three.js 3D WebGL Library for GitHub Pages Hosting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="webgl-container"></div>
<div id="reticle"></div>

<div id="uiOverlay" style="display: none;">
    <div class="hud-row">
        <div id="scoreDisplay">QUANTUM SHARDS: 0</div>
        <div id="waveDisplay">NEXUS SECTOR: 1</div>
    </div>
    <div class="hud-row">
        <div id="healthDisplay">CORE SHIELD: 100%</div>
        <div id="statusDisplay">STATUS: LIVE STREAM</div>
    </div>
</div>

<div id="menuScreen">
    <h1>AETHER CORE 4K</h1>
    <div class="subtitle">QUANTUM BREACH NEXUS</div>
    <p>The ultimate internet-breaking 3D browser shooter. Pilot your hyper-craft through infinite dynamic spatial grids, annihilate rogue quantum anomalies, and sync your repository live.</p>
    <button class="btn" onclick="startGame()">INITIALIZE NEXUS</button>
</div>

<script>
    let scene, camera, renderer;
    let gameRunning = false;
    let score = 0;
    let sector = 1;
    let coreShield = 100;
    
    let playerCraft, bullets = [], anomalies = [], gridLines = [];
    let touchStartX = 0, touchStartY = 0;
    let targetX = 0, targetY = 0;

    function initEngine() {
        const container = document.getElementById('webgl-container');

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020410);
        scene.fog = new THREE.FogExp2(0x020410, 0.035);

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Dynamic Lighting
        const ambientLight = new THREE.AmbientLight(0x00f3ff, 0.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff0055, 2, 50);
        pointLight.position.set(0, 10, -10);
        scene.add(pointLight);

        buildEnvironmentGrid();
        buildPlayerCraft();
        setupControls();

        window.addEventListener('resize', onWindowResize);
    }

    function buildEnvironmentGrid() {
        // Infinite scrolling cyber grid floor
        const gridHelper = new THREE.GridHelper(100, 50, 0x00f3ff, 0x1e293b);
        gridHelper.position.y = -3;
        scene.add(gridHelper);
        gridLines.push(gridHelper);
    }

    function buildPlayerCraft() {
        // Custom 3D Fighter Ship Mesh
        const geometry = new THREE.ConeGeometry(0.8, 2.2, 4);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00f3ff, 
            emissive: 0x0066ff,
            roughness: 0.2,
            metalness: 0.8 
        });
        playerCraft = new THREE.Mesh(geometry, material);
        playerCraft.rotation.x = Math.PI / 2;
        playerCraft.position.set(0, 0, 4);
        scene.add(playerCraft);
    }

    function setupControls() {
        window.addEventListener('pointerdown', (e) => {
            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!gameRunning) return;
            const deltaX = e.clientX - touchStartX;
            const deltaY = e.clientY - touchStartY;
            
            targetX += deltaX * 0.015;
            targetY -= deltaY * 0.015;

            // Clamp positions
            targetX = Math.max(-5, Math.min(5, targetX));
            targetY = Math.max(-2, Math.min(4, targetY));

            touchStartX = e.clientX;
            touchStartY = e.clientY;
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function spawnAnomaly() {
        if (Math.random() < 0.04 + (sector * 0.005)) {
            const geo = new THREE.OctahedronGeometry(0.9);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0xf43f5e, 
                emissive: 0xbe123c,
                roughness: 0.3 
            });
            const anomaly = new THREE.Mesh(geo, mat);
            anomaly.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 6, -40);
            scene.add(anomaly);
            anomalies.push(anomaly);
        }
    }

    let fireCounter = 0;
    function handleWeapons() {
        fireCounter++;
        if (fireCounter % 12 === 0 && gameRunning) {
            const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
            
            // Dual blasters
            const b1 = new THREE.Mesh(bulletGeo, bulletMat);
            b1.position.set(playerCraft.position.x - 0.5, playerCraft.position.y, playerCraft.position.z);
            scene.add(b1);
            bullets.push(b1);

            const b2 = new THREE.Mesh(bulletGeo, bulletMat);
            b2.position.set(playerCraft.position.x + 0.5, playerCraft.position.y, playerCraft.position.z);
            scene.add(b2);
            bullets.push(b2);
        }
    }

    function startGame() {
        score = 0;
        sector = 1;
        coreShield = 100;
        bullets.forEach(b => scene.remove(b));
        anomalies.forEach(a => scene.remove(a));
        bullets = [];
        anomalies = [];
        
        document.getElementById('scoreDisplay').innerText = `QUANTUM SHARDS: 0`;
        document.getElementById('waveDisplay').innerText = `NEXUS SECTOR: 1`;
        document.getElementById('healthDisplay').innerText = `CORE SHIELD: 100%`;
        
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('uiOverlay').style.display = 'flex';
        gameRunning = true;
        animate();
    }

    function animate() {
        if (!gameRunning) return;
        requestAnimationFrame(animate);

        // Smooth ship positioning interpolation
        playerCraft.position.x += (targetX - playerCraft.position.x) * 0.1;
        playerCraft.position.y += (targetY - playerCraft.position.y) * 0.1;
        playerCraft.rotation.z = -playerCraft.position.x * 0.15;

        // Move grid floor for motion effect
        gridLines.forEach(grid => {
            grid.position.z += 0.4;
            if (grid.position.z > 10) grid.position.z = 0;
        });

        handleWeapons();
        spawnAnomaly();

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.position.z -= 0.8;
            if (b.position.z < -45) {
                scene.remove(b);
                bullets.splice(i, 1);
            }
        }

        // Update Anomalies
        for (let i = anomalies.length - 1; i >= 0; i--) {
            let a = anomalies[i];
            a.position.z += 0.35 + (sector * 0.05);
            a.rotation.x += 0.02;
            a.rotation.y += 0.02;

            // Player Collision
            let distToPlayer = Math.hypot(playerCraft.position.x - a.position.x, playerCraft.position.y - a.position.y, playerCraft.position.z - a.position.z);
            if (distToPlayer < 1.2) {
                coreShield -= 25;
                document.getElementById('healthDisplay').innerText = `CORE SHIELD: ${Math.max(0, coreShield)}%`;
                scene.remove(a);
                anomalies.splice(i, 1);
                if (coreShield <= 0) {
                    gameOver();
                    return;
                }
                continue;
            }

            // Bullet Collisions
            let hit = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                let distToBullet = Math.hypot(b.position.x - a.position.x, b.position.y - a.position.y, b.position.z - a.position.z);
                if (distToBullet < 1.0) {
                    scene.remove(b);
                    bullets.splice(j, 1);
                    hit = true;
                    break;
                }
            }

            if (hit) {
                scene.remove(a);
                anomalies.splice(i, 1);
                score += 150;
                document.getElementById('scoreDisplay').innerText = `QUANTUM SHARDS: ${score}`;
                if (score >= sector * 1000) {
                    sector++;
                    document.getElementById('waveDisplay').innerText = `NEXUS SECTOR: ${sector}`;
                }
                continue;
            }

            if (a.position.z > 6) {
                scene.remove(a);
                anomalies.splice(i, 1);
            }
        }

        renderer.render(scene, camera);
    }

    function gameOver() {
        gameRunning = false;
        document.getElementById('uiOverlay').style.display = 'none';
        const menu = document.getElementById('menuScreen');
        menu.style.display = 'flex';
        menu.querySelector('h1').innerText = 'NEXUS COLLAPSED';
        menu.querySelector('.subtitle').innerText = 'BREACH DETECTED';
        menu.querySelector('p').innerText = `Final Score: ${score} | Sector Reached: ${sector}\nRedeploy your repository to restart the matrix.`;
        menu.querySelector('.btn').innerText = 'REDEPLOY NEXUS';
    }

    window.onload = initEngine;
</script>

</body>
</html>
